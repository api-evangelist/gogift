  - GoGift ships no official SDK in any language on any public registry.
  - Integration is copy-paste from the reference using third-party OIDC libraries.
  - The .NET example pins IdentityModel 4.6.0 while the current release is 7.0.0 — the strongest decay signal available for this provider's developer-facing material.
