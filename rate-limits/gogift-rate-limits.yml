provider: GoGift
providerId: gogift
created: '2026-05-04'
modified: '2026-09-12'
generated: '2026-09-12'
method: searched
source: https://docs.gogift.io/
sources:
  - https://docs.gogift.io/#overview
  - https://docs.gogift.io/#rest-api-reference
  - https://global.gogift.com/en/gift-card-api
tags:
  - Gift Cards
  - Rate Limiting
description: >-
  GoGift publishes NO rate limits for its API. Its single-page reference at docs.gogift.io was
  read end to end: there is no rate-limit section, no quota table, no 429 behaviour, no
  Retry-After guidance, and no RateLimit-* or X-RateLimit-* response header documented anywhere.
  The pricing page publishes no request quotas either — GoGift charges the face value of the
  rewards sent, not per API call.
note: >-
  This file previously carried a 2026-05-04 bulk-sweep SCAFFOLD with invented free/professional/
  enterprise tiers (10 rpm / 100 rpm / 1000 rpm and monthly quotas) and an invented set of
  X-RateLimit-* headers. None of that was published by GoGift. It has been replaced with the
  honest measured result: limit_count 0. An honest zero is data; a fabricated tier table is not.
limit_count: 0
limits: []
headers:
  documented: false
  limit: null
  remaining: null
  reset: null
  retryAfter: null
  policy: null
response_codes:
  throttled: null
  documented: false
policies: []
findings:
  - No rate limits are published for api.gogift.io.
  - No rate-limit response headers are documented, so an agent has no runtime signal to back off on.
  - No 429 or throttling behaviour is described.
  - Quotas, if any, are set contractually when GoGift provisions a client id and secret.
remediation_for_provider: >-
  Publishing the per-client request ceiling and returning RateLimit-Limit / RateLimit-Remaining /
  RateLimit-Reset (or Retry-After on 429) would give integrators — and any agent calling this
  API — a runtime signal they currently do not have.
