description: >-
  GoGift publishes a pricing PHILOSOPHY but no priced plan tiers. Its pricing page
  (https://global.gogift.com/en/pricing, HTTP 200, heading "Simple, transparent pricing for
  global rewards") states that customers pay the face value of the rewards they send, with no
  setup fees, no subscriptions and no hidden platform costs, and then routes the visitor either
  to a free business account or to sales. There is no tier table, no per-tier quota, no overage
  rate, and no API-call pricing anywhere on the site or in the API reference.
note: >-
  This file previously carried a 2026-05-04 bulk-sweep SCAFFOLD with three invented tiers
  (gogift-free / gogift-pro / gogift-enterprise) carrying invented request quotas, rate limits
  and TBD prices. GoGift publishes none of that. It has been replaced with the measured result:
  plan_count 0, plus the pricing model GoGift does publish.
plan_count: 0
plans: []
published_pricing_model:
  model: face-value pass-through
  statement: >-
    Customers pay the face value of the rewards they send. The pricing page states there are no
    setup fees, no subscriptions and no hidden platform costs.
  api_metered: false
  api_call_pricing_published: false
  currency: multi-currency (ISO 4217; the platform converts between value currency and payment currency using a per-line exchangeRate)
  source: https://global.gogift.com/en/pricing
  evidence_status: 200
payment_methods_documented:
  methods:
    - InvoiceByFinance
    - ExternalPsp
    - Trustly
  source: https://docs.gogift.io/#finalize-basket-request
onboarding:
  self_service_account: https://global.gogift.com/en/create-account
  sales_contact: https://global.gogift.com/en/contact
  demo: https://global.gogift.com/en/demo
  api_credentials_self_service: false
  note: >-
    A business account can be created online, but API client credentials (client id + client
    secret) and sandbox access are issued by GoGift, not self-served.
findings:
  - 'No priced plan tiers are published.'
  - 'API usage is not separately metered or priced; the commercial unit is the reward''s face value.'
  - 'Fees and discounts DO appear per-line in the API (Fee and ProductLine carry discountPercentage, tax and payment amounts), but the rates are contract-specific and not published.'
