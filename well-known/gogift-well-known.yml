  and the OpenID Connect discovery documents served by auth.gogift.io / auth-pre.gogift.io
provider: GoGift
providerId: gogift
description: >-
  Well-known discovery probe across every GoGift host. Two real documents were found: the
  OpenID Connect discovery document on the production authorization server (auth.gogift.io)
  and on the sandbox authorization server (auth-pre.gogift.io). Both parse as JSON and carry
  a real issuer/jwks_uri/token_endpoint. No security.txt, no api-catalog, no ai-plugin, no
  A2A agent card, and no aauth-resource document is served anywhere.
note: >-
  gogift.com, www.gogift.com and support.gogift.com answer HTTP 200 with the SAME HTML page
  body for EVERY /.well-known/* path probed (2.4MB, 216KB and 18.5KB respectively). That is a
  single-page-app catch-all, not a document; every one of those is recorded as a miss and none
  of them earns a pointer. Only the two application/json OpenID Connect documents are real.
