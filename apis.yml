aid: gogift
name: GoGift
description: >-
  GoGift is a global digital gift-card and rewards distributor that sells and delivers gift
  cards from thousands of brands across more than a hundred markets. Its REST API lets a
  business filter that catalogue by sales channel, delivery method and the countries a reward
  must be redeemable in, build a basket of gift cards for named recipients, and finalize it
  into a paid order that GoGift fulfils by email, SMS, CSV, webhook or physical post. The API
  is HTTPS-only and JSON-only, authenticated with OpenID Connect client credentials against
  auth.gogift.io, and served unversioned from api.gogift.io with a full sandbox at
  api-pre.gogift.io. GoGift supports idempotent replay on basket update and finalisation, page
  -number pagination, ISO 8601 / 3166 / 4217 / 639 data conventions, and one signed outbound
  webhook that carries the issued gift-card credentials back to the integrator.
