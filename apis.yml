apis:
  - aid: gogift:gogift
    name: GoGift Commerce API
    description: >-
      The GoGift REST API for buying and sending digital gift cards. Five documented operations
      cover the purchase flow end to end: filter the product catalogue, read a product and its
      purchasable inventory, create a basket, update the basket with buyer, recipients and
      product lines, and finalize the basket into a paid order. Delivery is by email, SMS, CSV
      by email, signed webhook or physical post. Authentication is OpenID Connect
      client_credentials against auth.gogift.io, and every request carries a JWT bearer token.
    humanURL: https://docs.gogift.io/
    baseURL: https://api.gogift.io
