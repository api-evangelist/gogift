generated: '2026-09-12'
method: searched
source: https://docs.gogift.io/
sources:
  - https://docs.gogift.io/#overview
  - https://docs.gogift.io/#authentication
  - https://docs.gogift.io/#idempotency
  - https://docs.gogift.io/#pagination
  - https://docs.gogift.io/#time
  - https://docs.gogift.io/#countries
